<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📅 Video Production Calendar</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: rgba(22, 28, 45, 0.7);
      --bg-glass: rgba(15, 23, 42, 0.6);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(139, 92, 246, 0.2);
      
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      
      --accent-violet: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
      --accent-pink: #ec4899;
      
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
      color: var(--text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      padding: 2rem;
    }

    .calendar-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .view-toggle {
      display: flex;
      gap: 0.5rem;
      background-color: var(--bg-card);
      padding: 0.25rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .view-btn {
      padding: 0.5rem 1.25rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-body);
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: var(--transition);
    }

    .view-btn.active {
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      color: white;
    }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .month-nav button {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font-body);
      transition: var(--transition);
    }

    .month-nav button:hover {
      border-color: var(--accent-cyan);
      background-color: rgba(6, 182, 212, 0.1);
    }

    .current-month {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 600;
      min-width: 200px;
      text-align: center;
    }

    .legend {
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    .calendar-view {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background-color: var(--border-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .calendar-header {
      background-color: var(--bg-dark);
      padding: 1rem;
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .calendar-day {
      background-color: var(--bg-dark);
      min-height: 120px;
      padding: 0.75rem;
      position: relative;
    }

    .calendar-day.other-month {
      opacity: 0.3;
    }

    .day-number {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
    }

    .calendar-day.today .day-number {
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    .event {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .event i {
      font-size: 0.7rem;
    }

    .event.youtube-long {
      background-color: rgba(239, 68, 68, 0.15);
      border-left: 3px solid var(--accent-red);
      color: var(--accent-red);
    }

    .event.youtube-short {
      background-color: rgba(245, 158, 11, 0.15);
      border-left: 3px solid var(--accent-yellow);
      color: var(--accent-yellow);
    }

    .event.linkedin {
      background-color: rgba(6, 182, 212, 0.15);
      border-left: 3px solid var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .event.twitter {
      background-color: rgba(139, 92, 246, 0.15);
      border-left: 3px solid var(--accent-violet);
      color: var(--accent-violet);
    }

    .event.sprint {
      background-color: rgba(236, 72, 153, 0.15);
      border-left: 3px solid var(--accent-pink);
      color: var(--accent-pink);
    }

    .week-view {
      display: none;
    }

    .week-view.active {
      display: block;
    }

    .week-grid {
      display: grid;
      grid-template-columns: 80px repeat(7, 1fr);
      gap: 1px;
      background-color: var(--border-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .time-label {
      background-color: var(--bg-dark);
      padding: 0.5rem;
      text-align: right;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-right: 1px solid var(--border-color);
    }

    .week-day-header {
      background-color: var(--bg-dark);
      padding: 1rem;
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .week-day-header.today {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(6, 182, 212, 0.2));
      border-top: 3px solid var(--accent-cyan);
    }

    @media (max-width: 968px) {
      .calendar-grid {
        grid-template-columns: 1fr;
      }

      .calendar-header {
        display: none;
      }

      .calendar-day {
        border-left: 3px solid var(--border-color);
        min-height: 80px;
      }

      .controls {
        flex-direction: column;
      }

      .header h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="calendar-container">
    <div class="header">
      <h1>📅 Video Production Calendar</h1>
      <p>Sprint 1: Claude Associate Dictionary</p>
    </div>

    <div class="controls">
      <div class="view-toggle">
        <button class="view-btn active" data-view="month">
          <i class="fas fa-calendar"></i> Month
        </button>
        <button class="view-btn" data-view="week">
          <i class="fas fa-calendar-week"></i> Week
        </button>
      </div>

      <div class="month-nav">
        <button id="prevMonth"><i class="fas fa-chevron-left"></i> Previous</button>
        <div class="current-month" id="currentMonth">January 2024</div>
        <button id="nextMonth">Next <i class="fas fa-chevron-right"></i></button>
      </div>

      <div class="legend">
        <div class="legend-item">
          <div class="legend-color" style="background-color: var(--accent-red);"></div>
          <span>🎥 YouTube Long (Mon)</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background-color: var(--accent-yellow);"></div>
          <span>📱 Shorts (Tue/Thu/Sat)</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background-color: var(--accent-cyan);"></div>
          <span>💼 LinkedIn (Wed/Fri)</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background-color: var(--accent-violet);"></div>
          <span>🐦 X (Varies)</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background-color: var(--accent-pink);"></div>
          <span>🎯 Sprint Items</span>
        </div>
      </div>
    </div>

    <div class="calendar-view month-view active" id="monthView">
      <div class="calendar-grid" id="calendarGrid">
        <!-- Generated by JavaScript -->
      </div>
    </div>

    <div class="calendar-view week-view" id="weekView">
      <p style="text-align: center; color: var(--text-muted); padding: 2rem;">
        Week view coming soon
      </p>
    </div>
  </div>

  <script>
    let currentDate = new Date();

    const productionSchedule = {
      monday: [
        { type: 'youtube-long', title: 'YouTube Long-form', icon: 'fa-youtube' }
      ],
      tuesday: [
        { type: 'youtube-short', title: 'YouTube Short', icon: 'fa-youtube' },
        { type: 'twitter', title: 'X Post', icon: 'fa-x-twitter' }
      ],
      wednesday: [
        { type: 'linkedin', title: 'LinkedIn Post', icon: 'fa-linkedin' },
        { type: 'twitter', title: 'X Post', icon: 'fa-x-twitter' }
      ],
      thursday: [
        { type: 'youtube-short', title: 'YouTube Short', icon: 'fa-youtube' },
        { type: 'twitter', title: 'X Post', icon: 'fa-x-twitter' }
      ],
      friday: [
        { type: 'linkedin', title: 'LinkedIn Post', icon: 'fa-linkedin' },
        { type: 'twitter', title: 'X Post', icon: 'fa-x-twitter' }
      ],
      saturday: [
        { type: 'youtube-short', title: 'YouTube Short', icon: 'fa-youtube' }
      ]
    };

    const sprint1Topics = [
      { day: 'monday', topic: 'Core Concepts', type: 'sprint' },
      { day: 'tuesday', topic: 'What is a Prompt?', type: 'sprint' },
      { day: 'wednesday', topic: 'Series Announcement', type: 'sprint' },
      { day: 'thursday', topic: 'Context Window', type: 'sprint' },
      { day: 'friday', topic: 'Study Guide', type: 'sprint' },
      { day: 'saturday', topic: 'What is a Token?', type: 'sprint' }
    ];

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      
      document.getElementById('currentMonth').textContent = 
        currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const prevLastDay = new Date(year, month, 0);
      
      const firstDayOfWeek = firstDay.getDay();
      const lastDate = lastDay.getDate();
      const prevLastDate = prevLastDay.getDate();

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      dayNames.forEach(day => {
        const header = document.createElement('div');
        header.className = 'calendar-header';
        header.textContent = day;
        grid.appendChild(header);
      });

      for (let i = firstDayOfWeek - 1; i >= 0; i--) {
        const day = createDayCell(prevLastDate - i, true);
        grid.appendChild(day);
      }

      const today = new Date();
      for (let date = 1; date <= lastDate; date++) {
        const isToday = 
          date === today.getDate() && 
          month === today.getMonth() && 
          year === today.getFullYear();
        
        const dayOfWeek = new Date(year, month, date).getDay();
        const day = createDayCell(date, false, isToday, dayOfWeek);
        grid.appendChild(day);
      }

      const remainingCells = 42 - (firstDayOfWeek + lastDate);
      for (let date = 1; date <= remainingCells; date++) {
        const day = createDayCell(date, true);
        grid.appendChild(day);
      }
    }

    function createDayCell(date, otherMonth, isToday = false, dayOfWeek = null) {
      const cell = document.createElement('div');
      cell.className = 'calendar-day';
      if (otherMonth) cell.classList.add('other-month');
      if (isToday) cell.classList.add('today');

      const dayNumber = document.createElement('div');
      dayNumber.className = 'day-number';
      dayNumber.textContent = date;
      cell.appendChild(dayNumber);

      if (!otherMonth && dayOfWeek !== null) {
        const dayName = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'][dayOfWeek];
        const events = productionSchedule[dayName] || [];
        
        events.forEach(event => {
          const eventEl = document.createElement('div');
          eventEl.className = `event ${event.type}`;
          eventEl.innerHTML = `<i class="fab ${event.icon}"></i> ${event.title}`;
          cell.appendChild(eventEl);
        });

        const sprintTopic = sprint1Topics.find(s => s.day === dayName);
        if (sprintTopic && currentDate.getMonth() === new Date().getMonth()) {
          const sprintEl = document.createElement('div');
          sprintEl.className = 'event sprint';
          sprintEl.innerHTML = `<i class="fas fa-graduation-cap"></i> ${sprintTopic.topic}`;
          cell.appendChild(sprintEl);
        }
      }

      return cell;
    }

    document.getElementById('prevMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const view = btn.dataset.view;
        document.querySelectorAll('.calendar-view').forEach(v => v.classList.remove('active'));
        document.getElementById(`${view}View`).classList.add('active');
      });
    });

    renderCalendar();
  </script>
</body>
</html>
